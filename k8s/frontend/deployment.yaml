apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fittrack
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: eva357/fittrack-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80        # nginx слуша на 80
          env:
            - name: BACKEND_URL
              value: http://backend:5000
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:        # за 2-те probs важи: Ако nginx ја враќа почетната страница, жив е и спремен
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20