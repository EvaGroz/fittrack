services:
  # Database 
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend-net


  # Backend API 
  backend:
    build: ./backend
    image: fittrack-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DB: fittrack
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net


  # Frontend (nginx) 
  frontend:
    build: ./frontend
    image: fittrack-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:5000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-net


volumes:
  mongo-data:

networks:
  frontend-net:
  backend-net: