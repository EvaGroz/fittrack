name: CI/CD

# When does the pipeline run
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Job 1: backend tests 
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # Job 2: frontend build check 
  build-frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # Job 3: build and push Docker images 
  docker:
    name: Docker ${{ matrix.service }}
    needs: [test-backend, build-frontend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/fittrack-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}


# Job 4: CD - update image tags for Argo CD 
  update-manifests:
    name: Update K8s manifests
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'   # samo pri push na main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set image tags and push
        run: |
          TAG="sha-${GITHUB_SHA::7}"  # gi zema sega so tag sha a ne so tag latest, za da ja zeme istata od dockerhub
          USER="${{ vars.DOCKERHUB_USERNAME }}"

          sed -i -E "s|image: .*/fittrack-backend:.*|image: ${USER}/fittrack-backend:${TAG}|" k8s/backend/deployment.yaml   # gi zamenuva sega imagies so soodvetniot tag
          sed -i -E "s|image: .*/fittrack-frontend:.*|image: ${USER}/fittrack-frontend:${TAG}|" k8s/frontend/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/backend/deployment.yaml k8s/frontend/deployment.yaml
          git commit -m "ci: deploy ${TAG} [skip ci]" || { echo "No changes"; exit 0; }
          git pull --rebase   # ako vo meguvreme imalo drug commit prvo go zema pa pravi git push
          git push