apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: fittrack
  labels:
    app: mongo
spec:
  clusterIP: None      # deka e headless service, za da sekoj pod ima svoja stabilna adresa so DNS iminja, namesto sekoj da ima razlicen IP
  selector:
    app: mongo
  ports:
    - name: mongo
      port: 27017            # porta na servisot
      targetPort: 27017      # Portata na kontejnerot kade ke slusha MongoDB